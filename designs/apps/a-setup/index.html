<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
/* Rouh's own tokens (rouh/static/app.css), with a light set derived for the light theme. */
:root {
  --bg: #0a0c10; --panel: #12161c; --panel-2: #171c24; --raise: #1c222b; --line: #232a34; --line-soft: #1b2129;
  --text: #e7ecf3; --dim: #9aa6b6; --dimmer: #7d8899;
  --accent: #5ec2ff; --accent-ink: #04121c; --accent-soft: rgba(94, 194, 255, 0.14);
  --good: #57d9a3; --warn: #f2b45e; --bad: #ff7a70;
  --good-soft: rgba(87, 217, 163, 0.12); --bad-soft: rgba(255, 122, 112, 0.12); --warn-soft: rgba(242, 180, 94, 0.13);
  --seg-a: #9aabc2; --seg-b: #4a5668; --seg-c: #2c3542; --seg-d: #222a35;
  --brown: #c79a74;
  --focus: #ffd76a;
  --radius: 14px; --radius-s: 9px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fa; --raise: #eef1f5; --line: #d9dee6; --line-soft: #e7ebf0;
    --text: #121821; --dim: #4c5868; --dimmer: #5d6979;
    --accent: #0866a6; --accent-ink: #ffffff; --accent-soft: rgba(8, 102, 166, 0.10);
    --good: #0d7752; --warn: #8a5600; --bad: #b42d27;
    --good-soft: rgba(13, 119, 82, 0.09); --bad-soft: rgba(180, 45, 39, 0.08); --warn-soft: rgba(138, 86, 0, 0.09);
    --seg-a: #3d4f66; --seg-b: #8a96a6; --seg-c: #b3bdc9; --seg-d: #d3d9e1;
    --brown: #8a5a33;
    --focus: #9a6b00;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* The shell: a stand-in for Rouh's chat column on a desk, and the Apps panel beside it. */
.shell { display: grid; grid-template-columns: minmax(300px, 0.68fr) minmax(0, 1fr); gap: 12px; padding: 12px; min-height: 100vh; }
.chat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; padding: 14px; gap: 10px; }
.chat-h { font-weight: 600; font-size: 14px; color: var(--dim); }
.chat-note { color: var(--dimmer); font-size: 13px; margin: 0; }
.chat-box { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.chat-box label { font-size: 12px; color: var(--dimmer); }
.chat-box textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; }
@media (max-width: 760px) { .shell { grid-template-columns: 1fr; padding: 0; gap: 0; } .chat { display: none; } .panel { border: 0; border-radius: 0; min-height: 100vh; } }

.head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.head-t { display: flex; flex-direction: column; min-width: 0; flex: 1 1 160px; }
.head h1 { font-size: 18px; margin: 0; line-height: 1.25; }
.head .counts { color: var(--dim); font-size: 13px; }
.head-acts { display: flex; gap: 8px; align-items: center; }
.body { padding: 18px; display: flex; flex-direction: column; gap: 22px; max-width: 920px; width: 100%; }
@media (max-width: 760px) { .head { padding: 12px 16px; } .body { padding: 16px; gap: 20px; } }

/* Buttons, in Rouh's ctl style. One primary per view. */
.btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; white-space: nowrap; text-decoration: none; color: var(--text); transition: background .15s, border-color .15s; }
.btn:hover { background: var(--raise); border-color: var(--dimmer); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--dim); }
.btn.quiet:hover { color: var(--text); background: var(--panel-2); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; position: relative; }
.btn.small::after { content: ""; position: absolute; inset: -4px 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); display: inline-grid; place-items: center; cursor: pointer; color: var(--dim); }
.icon-btn:hover { color: var(--text); }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* State: always a shape and a word. */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.st.good { color: var(--good); } .st.bad { color: var(--bad); } .st.warn { color: var(--warn); } .st.wait { color: var(--text); } .st.dim { color: var(--dim); }

/* Verdict */
.verdict { display: flex; gap: 14px; align-items: flex-start; }
.verdict .big { width: 36px; height: 36px; flex: none; margin-top: 2px; }
.verdict.good .big { color: var(--good); } .verdict.warn .big { color: var(--warn); } .verdict.bad .big { color: var(--bad); } .verdict.dim .big { color: var(--dim); }
.verdict h2 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -0.01em; text-wrap: balance; }
.verdict p { margin: 4px 0 0; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
@media (max-width: 760px) { .verdict h2 { font-size: 21px; } .verdict .big { width: 30px; height: 30px; } }

h3 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; font-weight: 600; color: var(--dim); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

/* Needs you */
.needs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.need { display: flex; gap: 12px; align-items: center; padding: 12px 14px; flex-wrap: wrap; background: var(--panel-2); }
.need + .need { border-top: 1px solid var(--line); }
.need-t { flex: 1 1 260px; min-width: 0; display: flex; gap: 10px; align-items: flex-start; }
.need-t .ico { margin-top: 2px; }
.need-t b { display: block; font-weight: 600; }
.need-t span { color: var(--dim); font-size: 13px; }
.need-a { display: flex; gap: 6px; flex-wrap: wrap; }
.need.bad .need-t .ico { color: var(--bad); } .need.warn .need-t .ico { color: var(--warn); }

/* Next step tracker */
.next { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; background: var(--panel-2); }
.next-top { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; justify-content: space-between; }
.next-top div { flex: 1 1 280px; min-width: 0; }
.next-top b { font-size: 16px; display: block; }
.next-top p { margin: 4px 0 0; color: var(--dim); }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
.track li { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); position: relative; }
.track .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel); color: var(--dim); }
.track li.now .dot { border-color: var(--accent); color: var(--accent); }
.track li.now { color: var(--text); font-weight: 600; }
.track li.done .dot { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.track li:not(:last-child)::before { content: ""; position: absolute; top: 12px; left: 30px; right: 4px; height: 2px; background: var(--line); }
@media (max-width: 760px) { .track { grid-template-columns: 1fr 1fr; row-gap: 12px; } .track li::before { display: none; } }

/* Where your apps live */
.where-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.where-top h3 { margin: 0; }
.bar { display: flex; height: 34px; border-radius: var(--radius-s); overflow: hidden; gap: 2px; }
.seg { display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; min-width: 34px; color: var(--text); }
.seg.a { background: var(--seg-a); color: var(--bg); }
.seg.b { background: var(--seg-b); } .seg.c { background: var(--seg-c); }
.seg.d { background: repeating-linear-gradient(135deg, var(--seg-d) 0 6px, var(--seg-c) 6px 12px); }
.seg.empty { background: transparent; border: 2px dashed var(--line); color: var(--dim); border-radius: var(--radius-s); }
.legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--dim); }
.legend li { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 18px; height: 6px; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px var(--dimmer); }
.plan-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-s); }
.plan-line span { flex: 1 1 220px; color: var(--dim); }
.plan-line b { color: var(--text); }

/* The grouped list */
.place { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.place + .place { margin-top: 12px; }
.place-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--panel-2); flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.place-h .sw { width: 18px; height: 6px; }
.place-h b { font-size: 14px; }
.place-h .tag { font-size: 12px; color: var(--dim); }
.place-h .grow { flex: 1; }
.place-say { padding: 8px 14px; font-size: 13px; color: var(--dim); border-bottom: 1px solid var(--line-soft); }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 136px minmax(0, 1fr) minmax(0, auto) 164px 28px; gap: 12px; align-items: center; padding: 0 14px; min-height: 56px; border-top: 1px solid var(--line-soft); cursor: pointer; transition: background .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.row .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .nm small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; }
.row a.addr { font-size: 13px; overflow-wrap: anywhere; min-height: 44px; display: inline-flex; align-items: center; justify-self: end; text-align: right; }
.row .when { font-size: 12px; color: var(--dim); text-align: right; }
.row .chev { color: var(--dimmer); justify-self: end; background: none; border: 0; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; margin-right: -10px; }
@media (max-width: 760px) {
  .row .when.kept { display: block; grid-area: when; text-align: left; }
  .row { grid-template-columns: minmax(0, 1fr) 36px; grid-template-areas: "nm chev" "st chev" "when chev" "addr chev"; gap: 2px 8px; padding: 10px 6px 6px 14px; }
  .row .nm { grid-area: nm; } .row .st { grid-area: st; } .row a.addr { grid-area: addr; justify-self: start; text-align: left; min-height: 36px; }
  .row .when { display: none; } .row .chev { grid-area: chev; margin: 0; }
}
.foot { display: flex; flex-direction: column; gap: 12px; }
details.brown, details.fold { border: 1px solid var(--line); border-radius: var(--radius-s); }
details.fold > summary { cursor: pointer; padding: 12px 14px; color: var(--text); font-weight: 600; min-height: 44px; list-style-position: inside; }
details.brown > summary { cursor: pointer; padding: 12px 14px; color: var(--brown); font-weight: 600; min-height: 44px; list-style-position: inside; }
details.fold > div, details.brown > div { padding: 0 14px 14px; color: var(--dim); }
details.fold ul, details.brown ul { margin: 6px 0 10px; padding-left: 18px; }

/* Focus views */
.back { align-self: flex-start; margin-left: -12px; }
.edge { margin-left: -16px; }
.focus-h { display: flex; gap: 12px; align-items: flex-start; }
.focus-h h2 { margin: 0; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; }
.focus-h p { margin: 4px 0 0; color: var(--dim); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.live { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--accent-soft); }
.live .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.facts { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--radius-s); overflow: hidden; }
.facts dt, .facts dd { margin: 0; padding: 9px 12px; border-top: 1px solid var(--line-soft); }
.facts dt { color: var(--dim); font-size: 13px; }
.facts dd { overflow-wrap: anywhere; }
.facts dt:first-of-type, .facts dt:first-of-type + dd { border-top: 0; }
@media (max-width: 760px) { .facts { grid-template-columns: 1fr; } .facts dd { border-top: 0; padding-top: 0; } }
.cmds { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-s); }
.cmds li { padding: 10px 12px; border-top: 1px solid var(--line-soft); display: grid; gap: 4px; }
.cmds li:first-child { border-top: 0; }
.cmds .top { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cmds .top b { flex: 1 1 auto; }
.cmds pre { margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); background: var(--panel-2); padding: 8px; border-radius: 6px; }
.cmds details summary { cursor: pointer; font-size: 13px; color: var(--accent); min-height: 36px; display: list-item; list-style-position: inside; padding-top: 8px; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px solid var(--bad); border-radius: var(--radius-s); }
.confirm span { flex: 1 1 220px; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
.notice { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-s); display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.notice > div { flex: 1 1 240px; }

/* Setup */
.hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 8px; border: 0; padding: 0; margin: 0; }
.hosts legend { font-weight: 600; margin-bottom: 8px; }
.host { position: relative; }
.host input { position: absolute; opacity: 0; inset: 0; }
.host label { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-s); cursor: pointer; min-height: 88px; background: var(--panel-2); }
.host label b { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.host label span { color: var(--dim); font-size: 13px; }
.host input:checked + label { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.host input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.pill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.line { display: flex; gap: 8px; align-items: stretch; }
.line code { flex: 1; min-width: 0; font: 13px/1.45 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; overflow-wrap: anywhere; }
@media (max-width: 760px) { .line { flex-direction: column; } }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: 13px; }
.field input, .field select { min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius-s); padding: 0 12px; width: 100%; }
.field small { color: var(--dim); }
.servers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.server { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px; display: grid; gap: 6px; }
.server-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.server .acts .btn.quiet:first-child { margin-left: -12px; }
.server p { margin: 0; color: var(--dim); font-size: 13px; }
.plan { list-style: none; margin: 0; padding: 0; counter-reset: p; border: 1px solid var(--line); border-radius: var(--radius); }
.plan li { counter-increment: p; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line-soft); align-items: start; }
.plan li:first-child { border-top: 0; }
.plan li::before { content: counter(p); width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--dim); }
.plan b { display: block; overflow-wrap: anywhere; }
.plan span { color: var(--dim); font-size: 13px; }
@media (max-width: 760px) { .plan li { grid-template-columns: 32px minmax(0, 1fr); } .plan li .btn { grid-column: 2; justify-self: start; } }
.empty-hero h2 { font-size: 26px; margin: 0 0 6px; line-height: 1.2; }
.empty-hero p { margin: 0; color: var(--dim); max-width: 60ch; }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 12px 0 0; }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; }
.why li { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px; color: var(--dim); }
.why li b { display: block; color: var(--text); margin-bottom: 4px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 32px); z-index: 5; }
.toast[hidden] { display: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="shell">
  <aside class="chat" aria-label="The chat (a stand-in for Rouh's chat column)">
    <div class="chat-h">Chat</div>
    <p class="chat-note">The chat column of Rouh sits here. Build a new app, an idea and Ask Rouh to change it put their sentence in its message box.</p>
    <div class="chat-box"><label for="msg">Message</label><textarea id="msg" placeholder="Type a message"></textarea></div>
  </aside>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastT"></span><button class="btn small quiet" id="toastU" type="button">Undo</button></div>

var undoFn = null, toastTimer = 0;
function toast(text, undo) {
  var t = document.getElementById('toast'); document.getElementById('toastT').textContent = text;
  var pr = document.getElementById('panel').getBoundingClientRect(); t.style.left = (pr.left + pr.width / 2) + 'px';
  var u = document.getElementById('toastU'); u.hidden = !undo; undoFn = undo || null; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
}
document.getElementById('toastU').addEventListener('click', function () { if (undoFn) { undoFn(); undoFn = null; } document.getElementById('toast').hidden = true; });
function say(text) { var m = document.getElementById('msg'); m.value = text; if (getComputedStyle(m.closest('.chat')).display !== 'none') { m.focus(); } toast('In the message box: “' + text.slice(0, 48) + (text.length > 48 ? '…' : '') + '”'); }
function go(view, appSlug) { V.view = view; V.app = appSlug || ''; V.confirm = 0; draw(); window.scrollTo(0, 0); var f = document.querySelector('#panel .back, #panel h2'); if (f && f.focus) { f.setAttribute('tabindex', '-1'); f.focus({ preventScroll: true }); } }

var SAID = { restart: 'Restart', update: 'Update', rollback: 'Roll back', logs: 'Logs', backup: 'Back up' };
function verb(a, v) {
  var c = { id: Date.now(), verb: v, said: SAID[v], state: 'sent', asked_at: Date.now() / 1000, asked_by: 'page', output: '' };
  a.commands.unshift(c); draw();
  var sv = server(a.server_id);
  if (sv && sv.state === 'silent') { toast(sv.name + ' has not called in. It takes the ' + SAID[v] + ' when it does.'); return; }
  setTimeout(function () { c.state = 'running'; draw(); }, 1200);
  setTimeout(function () {
    c.state = 'done'; c.output = v === 'logs' ? '11:02:14 GET / 200 12ms\n11:02:31 GET /api/list 200 40ms' : 'ok';
    if (v === 'restart' || v === 'rollback') { a.state = 'answering'; a.checked_at = Date.now() / 1000; a.check_said = 'Answered 200 in 180 ms.'; }
    if (v === 'backup') { a.backup_ok = true; a.backup_at = Date.now() / 1000; }
    draw(); toast(SAID[v] + ' of ' + a.name + ': done.');
  }, 3200);
}

function wire(root) {
  root.querySelectorAll('[data-do]').forEach(function (n) {
    var d = n.getAttribute('data-do');
    var evt = n.tagName === 'FORM' ? 'submit' : n.tagName === 'INPUT' ? 'change' : 'click';
    n.addEventListener(evt, function (e) {
      if (evt === 'submit') { e.preventDefault(); }
      if (n.tagName === 'A' && d !== 'page') { return; }
      if (e.target.closest('a') && d === 'open') { return; }
      e.stopPropagation();
      var a = n.dataset.app ? app(n.dataset.app) : null;
      switch (d) {
        case 'build': say('Build me an app that '); break;
        case 'idea': say(D.ideas[+n.dataset.i].say); break;
        case 'go': go(n.dataset.view); break;
        case 'open': go('app', n.dataset.app); break;
        case 'page': e.preventDefault(); toast('Opens the page in the workspace.'); break;
        case 'check': V.checking = true; draw(); setTimeout(function () { V.checking = false; D.apps.forEach(function (x) { x.checked_at = Date.now() / 1000; }); NOW = Date.now() / 1000; draw(); toast('Checked every app just now.'); }, 1400); break;
        case 'checkone': a.checked_at = Date.now() / 1000; NOW = a.checked_at; draw(); toast(a.name + ': ' + (a.state === 'down' ? 'still not answering.' : 'answering.')); break;
        case 'verb': verb(a, n.dataset.verb); break;
        case 'logs': go('app', a.slug); verb(a, 'logs'); break;
        case 'fix': say('My app ' + a.name + ' (' + a.url + ') is not answering. Find out why and fix it.'); break;
        case 'change': say('In my app ' + a.name + ' (' + a.url + '), '); break;
        case 'move': say('Move ' + n.dataset.name + ' onto my apps server.'); break;
        case 'report': toast('Asked for a report. It comes in within a minute.'); break;
        case 'confirm': V.confirm = +n.dataset.id; draw(); break;
        case 'unconfirm': V.confirm = 0; draw(); break;
        case 'remove': var i = D.apps.indexOf(a); D.apps.splice(i, 1); go('home'); toast(a.name + ' is off the list.', function () { D.apps.splice(i, 0, a); draw(); }); break;
        case 'host': V.host = n.value; draw(); break;
        case 'makeline': V.line = true; if (!D.servers.some(function (x) { return x.state === 'waiting'; })) { D.servers.unshift({ id: 99, name: 'apps-1', host_name: D.hosts.filter(function (x) { return x.id === V.host; })[0].name, address: '', state: 'waiting', standard: true, seen_at: 0, made_at: NOW, join_until: NOW + 7 * 86400 }); } draw(); break;
        case 'copy': n.textContent = 'Copied'; setTimeout(function () { n.textContent = 'Copy'; }, 1800); break;
        case 'token': if (document.getElementById('tok').value.trim()) { V.token = true; draw(); toast('Token saved and sealed.'); } break;
        case 'vps': V.vps = true; draw(); break;
        case 'forget': V.vps = false; V.token = false; draw(); toast('The token is forgotten.'); break;
        case 'hsset': toast('Rouh is setting it up. It turns Ready by itself.'); break;
        case 'wipeask': V.wipe = +n.dataset.id; draw(); var w = document.getElementById('wipe'); if (w) { w.focus(); } break;
        case 'unwipe': V.wipe = 0; draw(); break;
        case 'wipe': { var v = D.vps.filter(function (x) { return x.id === +n.dataset.id; })[0]; if (document.getElementById('wipe').value.trim() === v.hostname) { V.wipe = 0; draw(); toast('Erasing ' + v.hostname + ' and setting it up.'); } else { toast('Type ' + v.hostname + ' exactly to go on.'); } break; }
        case 'srvoff': { var sv = D.servers.filter(function (x) { return x.id === +n.dataset.server; })[0];
          if (sv.state === 'waiting') { D.servers.splice(D.servers.indexOf(sv), 1); V.line = false; draw(); toast('The setup line for ' + sv.name + ' is cancelled.'); }
          else { V.confirm = -sv.id; draw(); } break; }
        case 'srvoffyes': { var sv2 = D.servers.filter(function (x) { return x.id === +n.dataset.server; })[0]; D.servers.splice(D.servers.indexOf(sv2), 1); V.confirm = 0; draw(); toast(sv2.name + ' is off the list. Nothing on it is stopped.'); break; }
        case 'add':
          var sid = document.getElementById('as').value;
          D.apps.push({ id: Date.now(), slug: 'new' + Date.now(), name: document.getElementById('an').value, url: document.getElementById('au').value, server_id: sid ? +sid : null, elsewhere: document.getElementById('ae').value, state: 'unknown', checked_at: 0, what: '', data_at: '', commands: [] });
          go('home'); toast('Added. Rouh checks it within five minutes.'); break;
        case 'noop': toast('Closes the Apps panel.'); break;
      }
    });
  });
  var wp = root.querySelector('#wipe'); if (wp) { wp.addEventListener('input', function () { var b = wp.form.querySelector('button[type=submit]'); b.disabled = wp.value.trim() !== b.dataset.name; }); }
  var sel = root.querySelector('#as'); if (sel) { sel.addEventListener('change', function () { document.getElementById('aw').hidden = !!sel.value; }); }
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && V.view !== 'home') { go('home'); } });
draw();
</script>
</body>
</html>
