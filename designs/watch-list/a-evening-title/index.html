<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbour Lights - Watch list</title>
<style>:root{--bg:#0a0c10;--bg-2:#0e1116;--panel:#12161c;--panel-2:#171c24;--line:#232a34;--line-soft:#1b2129;--text:#e7ecf3;
--dim:#8d9aac;--dimmer:#64707f;--accent:#5ec2ff;--accent-ink:#04121c;--accent-soft:rgba(94,194,255,.14);--warn:#f2b45e;
--bad:#ff7a70;--focus:#ffd76a;--radius:14px;--radius-s:9px;--shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0a0c10;color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ctl{appearance:none;cursor:pointer;display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);
color:var(--text);padding:9px 12px;border-radius:var(--radius-s);font:inherit;font-size:13px;text-align:left;width:100%;text-decoration:none}
.ctl:hover{border-color:var(--dim)}.ctl:disabled{opacity:.5;cursor:default}.ctl svg{flex:0 0 auto;color:var(--dim)}
.ctl.small{width:auto;padding:4px 10px;font-size:12px;color:var(--dim);background:transparent}.ctl.small:hover{color:var(--text)}
#watchView{position:relative;display:flex;flex-direction:column;height:100%;padding:16px 20px 0;max-width:1440px;margin:0 auto;
background:var(--bg);color:var(--text)}
@media (max-width:560px){#watchView{padding:12px 12px 0}}
.run-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.run-head h3{margin:0;font-size:16px}.layer-x{appearance:none;border:0;background:none;color:var(--dim);font-size:24px;width:44px;height:44px;cursor:pointer}
/* The watch list (`watchlistpage.js`), redesigned whole in step 202-05 (task 202).
   The page answers "what do we put on tonight?" first: a sentence that counts the list, the lists
   strip, who sees the list, Tonight large, then the shelf (Up next, Watched, All; search; Filter).
   Rouh's own tokens, with a light set of its own; the posters carry the colour and the chrome stays
   quiet. One accent, for the one main press of each view and for what is chosen. Type scale:
   12, 13, 14, 16, 20, 28 px. Spacing in steps of 4 px. */

/* Light: the layer redefines Rouh's tokens for itself, so everything inside follows. */
@media (prefers-color-scheme: light) {
  .wl-view:not([data-theme="dark"]) {
    --bg: #f5f6f8; --bg-2: #eceef2; --panel: #ffffff; --panel-2: #f0f2f5; --line: #cfd5dd; --line-soft: #e2e6eb;
    --text: #12161c; --dim: #4b5664; --dimmer: #5c6876; --accent: #0a64a4; --accent-ink: #ffffff;
    --accent-soft: rgba(10, 100, 164, .10); --warn: #8a5a00; --bad: #b3261e; --focus: #7a5200;
    --shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 12px 28px rgba(16, 24, 40, .12);
    color-scheme: light; background: var(--bg); color: var(--text);
  }
}
.wl-view[data-theme="light"] {
  --bg: #f5f6f8; --bg-2: #eceef2; --panel: #ffffff; --panel-2: #f0f2f5; --line: #cfd5dd; --line-soft: #e2e6eb;
  --text: #12161c; --dim: #4b5664; --dimmer: #5c6876; --accent: #0a64a4; --accent-ink: #ffffff;
  --accent-soft: rgba(10, 100, 164, .10); --warn: #8a5a00; --bad: #b3261e; --focus: #7a5200;
  --shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 12px 28px rgba(16, 24, 40, .12);
  color-scheme: light; background: var(--bg); color: var(--text);
}

.wl-view:focus { outline: none; }
.wl-wrap { position: relative; flex: 1 1 0; min-height: 0; display: flex; }
.wl-body { container: wl / inline-size; flex: 1 1 auto; min-width: 0; overflow: auto; scrollbar-width: thin; padding: 2px 2px 160px; }
.wl-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.wl-page.has-detail { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); }
.wl-main { display: grid; gap: 20px; min-width: 0; align-content: start; }
.wl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wl-h { margin: 0; font-size: 13px; font-weight: 650; color: var(--dim); }
.wl-lede { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; max-width: 62ch; }
.wl-hint { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
.wl-dim { color: var(--dim); font-size: 12px; }
.wl-error { margin: 0; color: var(--bad); font-size: 14px; }

/* The controls: Rouh's .ctl, sized for a finger. */
.wl-view .ctl { width: auto; min-height: 44px; justify-content: center; white-space: nowrap; border-radius: 10px;
  transition: background-color .15s, border-color .15s, color .15s; }
.wl-view .ctl.small { min-height: 44px; font-size: 13px; }
.wl-view .ctl:focus-visible, .wl-view a:focus-visible, .wl-view button:focus-visible,
.wl-view summary:focus-visible, .wl-in:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; }
.wl-view .ctl:active, .wl-view button:active { transform: translateY(1px); }
.wl-primary.ctl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.wl-primary.ctl svg { color: var(--accent-ink); }
.wl-primary.ctl:hover { filter: brightness(1.08); border-color: var(--accent); }
.wl-ghost.ctl { background: transparent; text-decoration: none; }
.wl-ghost.ctl:hover { background: var(--panel-2); }
.wl-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* The head: the sentence, and Add a title shaped like the box it opens. */
.wl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.wl-headline { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; text-wrap: pretty; }
.wl-addfield { appearance: none; cursor: text; display: flex; align-items: center; gap: 10px; width: min(380px, 100%);
  min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); font: inherit; font-size: 14px; text-align: left; transition: border-color .15s; }
.wl-addfield:hover { border-color: var(--dim); }
.wl-addfield svg { color: var(--accent); flex: 0 0 auto; }
.wl-addfield-text { font-weight: 650; }
.wl-addfield-hint { color: var(--dim); font-size: 13px; }
.wl-add-btn svg { color: var(--accent-ink); }

/* Fields. */
.wl-field { display: grid; gap: 6px; min-width: 0; }
.wl-field-label { font-size: 12px; font-weight: 650; color: var(--dim); }
.wl-in {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font: inherit; font-size: 14px; line-height: 1.4;
}
.wl-in::placeholder { color: var(--dim); opacity: .9; }
.wl-in:focus { border-color: var(--accent); outline: none; }
textarea.wl-in { resize: vertical; min-height: 80px; }
select.wl-in { padding-right: 28px; cursor: pointer; }

/* A segmented choice: the time they have, a title's status, and Up next / Watched / All. */
.wl-seg, .wl-tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel-2); max-width: 100%; }
.wl-seg-b, .wl-tab { appearance: none; cursor: pointer; border: 0; background: transparent; color: var(--dim);
  font: inherit; font-size: 13px; font-weight: 650; min-height: 40px; padding: 6px 12px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.wl-seg-b:hover, .wl-tab:hover { color: var(--text); }
.wl-seg-b[aria-pressed="true"], .wl-tab[aria-selected="true"] { background: var(--panel); color: var(--text);
  box-shadow: 0 0 0 1px var(--accent) inset; }
.wl-tab-n { font-size: 12px; font-weight: 650; min-width: 22px; padding: 1px 7px; border-radius: 999px;
  background: var(--line-soft); color: var(--dim); font-variant-numeric: tabular-nums; text-align: center; }
.wl-tab-n.is-on { background: var(--accent); color: var(--accent-ink); }

/* Posters, and the drawn one when there is none. */
.wl-poster { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
  background: var(--panel-2); border: 1px solid var(--line-soft); }
.wl-poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
.wl-poster.is-none { display: grid; place-items: center; padding: 8px;
  background: hsl(var(--wl-hue, 210) 26% 22%); border-color: hsl(var(--wl-hue, 210) 28% 30%); }
.wl-initials { font-size: clamp(22px, 4vw, 40px); font-weight: 750; letter-spacing: 0.02em;
  color: hsl(var(--wl-hue, 210) 60% 88%); text-transform: uppercase; }
.wl-poster.is-thumb { width: 40px; flex: 0 0 40px; border-radius: 6px; }
.wl-poster.is-thumb .wl-initials { font-size: 14px; }
.wl-poster.is-big { width: 136px; flex: 0 0 136px; }

/* The lists strip: one row that scrolls inside itself, with a fade on the side that has more. */
.wl-strip-line { display: flex; align-items: center; gap: 6px; min-width: 0; margin-bottom: -8px; }
.wl-strip { position: relative; min-width: 0; flex: 0 1 auto; }
.wl-lists { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.wl-lists::-webkit-scrollbar { display: none; }
.wl-strip.has-more-right .wl-lists { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); }
.wl-strip.has-more-left .wl-lists { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 56px), transparent);
  mask-image: linear-gradient(to left, #000 calc(100% - 56px), transparent); }
.wl-strip.has-more-left.has-more-right .wl-lists {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 56px, #000 calc(100% - 56px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 56px, #000 calc(100% - 56px), transparent); }
.wl-list-b { appearance: none; cursor: pointer; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  color: var(--dim); font: inherit; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: background-color .15s, border-color .15s, color .15s; }
.wl-list-b:hover { color: var(--text); border-color: var(--dim); }
.wl-list-b[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
.wl-list-b svg { color: var(--dim); }
.wl-list-new { border-style: dashed; }
.wl-list-new svg { color: var(--accent); }

/* Who sees the list: one quiet line. A person is initials in a circle with their name beside them. */
.wl-people { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
.wl-people-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.wl-person { display: inline-flex; align-items: center; gap: 8px; min-width: 0; margin: 0; font-size: 13px; flex-wrap: wrap; }
.wl-person-name { font-weight: 650; overflow-wrap: anywhere; }
.wl-person.is-invited .wl-face { border-style: dashed; color: var(--dim); }
.wl-face { display: inline-grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-size: 12px; font-weight: 750; }
.wl-only { color: var(--dim); }
.wl-only .wl-person-name { color: var(--text); }
.wl-face.is-small { width: 24px; height: 24px; font-size: 10px; }
.wl-people-b.ctl.small { gap: 6px; }

/* Tonight: the pick, large. */
.wl-tonight { display: grid; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--panel); }
.wl-tonight-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wl-tonight-head .wl-h { font-size: 16px; color: var(--text); }
.wl-times .wl-seg-b { min-height: 36px; padding: 4px 12px; }
.wl-pick { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 20px; align-items: start; }
.wl-pick-poster, .wl-then-item, .wl-open { text-decoration: none; }
.wl-pick-poster { display: block; border-radius: 10px; }
.wl-pick-body { display: grid; gap: 8px; min-width: 0; align-content: start; }
.wl-pick-title { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.wl-pick-title a { color: var(--text); text-decoration: none; }
@media (hover: hover) { .wl-pick-title a:hover { text-decoration: underline; } }
.wl-pick-facts { margin: 0; color: var(--dim); font-size: 14px; }
.wl-pick-why { margin: 0; font-size: 14px; line-height: 1.5; max-width: 60ch; }
.wl-pick-body .wl-acts { margin-top: 8px; }
.wl-pick:has(.wl-then) { grid-template-columns: 148px minmax(0, 1fr) minmax(220px, 300px); }
.wl-then { display: grid; gap: 6px; align-content: start; padding-left: 20px; border-left: 1px solid var(--line-soft); min-width: 0; }
.wl-then-h { margin: 0; font-size: 13px; font-weight: 650; color: var(--dim); }
.wl-then-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.wl-then-item { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px; border-radius: 10px;
  color: var(--text); text-decoration: none; }
.wl-then-item:hover { background: var(--panel-2); }
.wl-then-item .wl-poster.is-thumb { width: 32px; flex-basis: 32px; }
.wl-then-title { font-size: 13px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.wl-tonight-none { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Progress through a show. */
.wl-progress { display: grid; gap: 4px; min-width: 0; }
.wl-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.wl-fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.wl-progress-words { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wl-progress.is-wide { max-width: 420px; }
.wl-progress.is-wide .wl-bar { height: 8px; }

/* The shelf: which titles, search and Filter on one row; the Filter panel; the chips of what is on. */
.wl-shelf-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.wl-tools { display: flex; gap: 8px; align-items: center; flex: 1 1 420px; justify-content: flex-end; min-width: 0; }
.wl-search { position: relative; flex: 0 1 380px; min-width: 0; }
.wl-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
.wl-search .wl-in { padding-left: 36px; }
.wl-filter-b.ctl { gap: 8px; flex: 0 0 auto; }
.wl-filter-b[aria-expanded="true"] { border-color: var(--accent); }
.wl-filters { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.wl-choices { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.wl-choice-row { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.wl-opt { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
  padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text);
  font: inherit; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.wl-opt:hover { border-color: var(--dim); }
.wl-opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 650; }
.wl-opt-n { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wl-chips { list-style: none; margin: -8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.wl-chip { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
  padding: 4px 8px 4px 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft);
  color: var(--text); font: inherit; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.wl-chip svg { color: var(--dim); flex: 0 0 auto; }
.wl-chip:hover svg { color: var(--text); }
.wl-found { margin: 0 0 8px; font-size: 13px; color: var(--dim); }

/* The posters' grid. */
.wl-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px 16px;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); }
.wl-card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.wl-open { display: grid; gap: 8px; color: var(--text); text-decoration: none; border-radius: 10px; }
.wl-open .wl-poster { transition: border-color .15s, transform .15s; }
.wl-open:hover .wl-poster { border-color: var(--dim); }
@media (hover: hover) { .wl-open:hover .wl-card-title { text-decoration: underline; } }
.wl-card-text { display: grid; gap: 2px; min-width: 0; }
.wl-card-title { font-size: 14px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.wl-card-facts { font-size: 12px; color: var(--dim); line-height: 1.4; }
.wl-card-foot { display: grid; gap: 8px; }
.wl-card-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; min-height: 44px; }
.wl-quick.ctl.small { color: var(--text); border-color: var(--line); background: transparent; padding: 4px 12px; }
.wl-quick.ctl.small:hover { border-color: var(--accent); background: var(--panel-2); }
.wl-quick-pair { display: flex; flex-wrap: wrap; gap: 6px; }
.wl-quick-all.ctl.small { color: var(--dim); }
.wl-quick-again.ctl.small { gap: 6px; }

/* Status: a shape and a word, never a colour alone. */
.wl-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: var(--dim); }
.wl-status-shape { width: 10px; height: 10px; flex: 0 0 10px; border: 1.5px solid currentColor; border-radius: 50%; }
.wl-status-watching { color: var(--text); }
.wl-status-watching .wl-status-shape { background: conic-gradient(currentColor 0 50%, transparent 50% 100%); }
.wl-status-watched .wl-status-shape { background: currentColor; }

/* A rating is its number out of 10, never stars to count. */
.wl-score { display: inline-flex; align-items: baseline; gap: 1px; font-variant-numeric: tabular-nums; }
.wl-score-n { font-size: 14px; font-weight: 750; color: var(--text); }
.wl-score-of { font-size: 12px; color: var(--dim); }
.wl-card-said { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.wl-rewatch { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; color: var(--text);
  padding: 1px 8px; border-radius: 999px; border: 1px dashed var(--dim); }
.wl-their { font-size: 12px; }
.wl-card-who { font-size: 12px; color: var(--dim); line-height: 1.4; overflow-wrap: anywhere; }

/* Tags: his own words, on cards and on a title. */
.wl-tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.wl-tag { font-size: 12px; line-height: 1.3; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
  color: var(--dim); overflow-wrap: anywhere; max-width: 100%; }
.wl-tag.is-more { border-style: dashed; }
.wl-tag.is-edit { display: inline-flex; align-items: center; gap: 2px; padding: 0 0 0 10px; font-size: 13px; color: var(--text); }
.wl-tag-x { appearance: none; cursor: pointer; border: 0; background: none; color: var(--dim); width: 44px; height: 44px;
  display: grid; place-items: center; border-radius: 6px; }
.wl-tag-x:hover { color: var(--bad); }
.wl-tag-row { display: flex; gap: 8px; align-items: center; }
.wl-tag-row .wl-in { flex: 1 1 auto; min-width: 0; }
.wl-tagedit { gap: 8px; }
.wl-also { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 0 0 12px; }
.wl-history { display: flex; align-items: flex-start; gap: 8px; margin: 0; font-size: 13px; line-height: 1.5; color: var(--text); }
.wl-history svg { flex: 0 0 auto; margin-top: 3px; color: var(--dim); }
.wl-match-have { font-size: 12px; font-weight: 650; color: var(--text); }
.wl-match.is-have { border-style: dashed; }

/* Adding. */
.wl-add { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--accent); border-radius: 16px; background: var(--panel); }
.wl-add-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wl-add-top .wl-h { font-size: 16px; color: var(--text); }
.wl-add-in { font-size: 16px; min-height: 48px; }
.wl-matches { display: grid; gap: 12px; }
.wl-match-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.wl-match { appearance: none; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--text); font: inherit; min-height: 64px; }
.wl-match:hover:not(:disabled) { border-color: var(--accent); }
.wl-match:disabled { opacity: 0.6; cursor: default; }
.wl-match-text { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; }
.wl-match-title { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }

.wl-hero { display: flex; gap: 16px; align-items: flex-start; }
.wl-hero-info { display: grid; gap: 6px; min-width: 0; }
.wl-detail-title { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }

.wl-genres { list-style: none; margin: 2px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.wl-genre { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--line-soft); color: var(--dim); }
.wl-detail-acts .ctl { flex: 0 1 auto; }
.wl-sec { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line-soft); min-width: 0; }
.wl-status-seg { justify-self: start; }
.wl-mine { display: grid; gap: 16px; }
.wl-rate { display: grid; gap: 8px; }
.wl-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 10px; }
/* The rating pad: the number large, then 1 to 10 to press, then Save. */
.wl-pad { display: grid; gap: 10px; }
.wl-pad-big { display: flex; align-items: baseline; gap: 4px; min-height: 52px; font-variant-numeric: tabular-nums; }
.wl-pad-n { font-size: 44px; line-height: 1; font-weight: 750; letter-spacing: -0.02em; min-width: 1.2ch; }
.wl-pad-of { font-size: 16px; font-weight: 650; color: var(--dim); }
.wl-pad-said { margin-left: 12px; font-size: 13px; color: var(--dim); }
.wl-pad-big.is-hover .wl-pad-n { color: var(--accent); }
.wl-pad-nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-width: 360px; }
.wl-num { appearance: none; cursor: pointer; min-height: 44px; min-width: 0; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font: inherit; font-size: 16px; font-weight: 700;
  font-variant-numeric: tabular-nums; transition: background-color .15s, border-color .15s; }
.wl-num:hover { border-color: var(--accent); }
.wl-num.below { background: var(--accent-soft); }
.wl-num.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wl-pad-acts .ctl:disabled { opacity: .5; }
.wl-save-ready.ctl { font-weight: 650; }
.wl-save-ready.wl-primary.ctl { color: var(--accent-ink); }
.wl-raters { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.wl-rater { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.wl-rater-name { font-size: 13px; font-weight: 650; min-width: 44px; overflow-wrap: anywhere; }
.wl-rater-note { flex: 1 0 100%; padding-left: 40px; margin: 0; font-size: 13px; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.wl-outs { display: flex; flex-wrap: wrap; gap: 0 16px; }
.wl-out { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--accent);
  text-decoration: none; font-size: 14px; }
.wl-out:hover { text-decoration: underline; }
.wl-about { display: grid; gap: 8px; }
.wl-about-text { margin: 0; font-size: 14px; line-height: 1.55; color: var(--text); max-width: 64ch; }

.wl-seasons { display: grid; gap: 8px; }
.wl-season { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
.wl-season-sum { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  gap: 10px; min-height: 44px; padding: 8px 12px; }
.wl-season-sum::-webkit-details-marker { display: none; }
.wl-season-sum::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--dim);
  border-bottom: 1.5px solid var(--dim); transform: rotate(-45deg); transition: transform .15s; flex: 0 0 auto; }
.wl-season[open] > .wl-season-sum::before { transform: rotate(45deg); }
.wl-season-name { flex: 1 1 auto; font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
.wl-season-facts { font-size: 12px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wl-eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding: 2px 12px 12px; }
.wl-ep { appearance: none; cursor: pointer; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); font: inherit; font-size: 13px; font-weight: 650;
  font-variant-numeric: tabular-nums; }
.wl-ep:hover { border-color: var(--dim); color: var(--text); }
.wl-ep.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.wl-ep.is-next { border-style: dashed; border-color: var(--accent); color: var(--text); }
.wl-season-acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }

.wl-edit { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
.wl-edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; }
.wl-tail { display: flex; flex-wrap: wrap; gap: 6px; }
.wl-tail .ctl.small { gap: 6px; }
.wl-remove.ctl.small:hover { color: var(--bad); border-color: var(--bad); }
.wl-when { margin: 0; }
.wl-onlist { display: flex; align-items: end; gap: 8px 16px; flex-wrap: wrap; margin: 0; }
.wl-onlist .wl-select .wl-in { min-width: 200px; }

.wl-empty { display: grid; gap: 12px; justify-items: start; padding: 24px 20px; border: 1px dashed var(--line);
  border-radius: 16px; }
.wl-empty-first { padding: 32px 24px; }

/* A note at the foot, with Undo where a press can be taken back. Above the sheet and the title page. */
.wl-toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9;
  display: flex; align-items: center; gap: 10px; max-width: min(680px, calc(100% - 24px));
  padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 14px; color: var(--text); }
.wl-toast-text { flex: 1 1 auto; min-width: 0; }
.wl-toast-undo { appearance: none; cursor: pointer; border: 0; background: none; color: var(--accent);
  font: inherit; font-weight: 700; min-height: 44px; padding: 0 12px; border-radius: 8px; }
.wl-toast-undo:hover { background: var(--accent-soft); }
.wl-toast-x { appearance: none; cursor: pointer; border: 0; background: none; color: var(--dim); width: 44px; height: 44px;
  display: grid; place-items: center; border-radius: 8px; }
.wl-toast-x:hover { color: var(--text); background: var(--line-soft); }

.wl-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; cursor: pointer; }
.wl-check input, .wl-radio input { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; margin: 0; }

/* The New list, Share a list and People sheets. */
.wl-sheet-back { position: absolute; inset: 0; z-index: 8; display: grid; place-items: start center; overflow: auto;
  padding: 48px 16px 112px; background: rgba(4, 6, 10, 0.62); }
.wl-sheet { width: min(560px, 100%); display: grid; gap: 16px; padding: 20px; border-radius: 16px;

.wl-radio-name { font-size: 14px; font-weight: 650; }
.wl-bring { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 0 12px; }

.wl-confirm { display: grid; gap: 8px; }
.wl-leave { display: grid; gap: 8px; justify-items: start; padding: 12px; border: 1px solid var(--bad); border-radius: 10px; }

.is-readonly .wl-quick, .is-readonly .wl-quick-pair, .is-readonly .wl-tonight .wl-acts > button,
.is-readonly .wl-detail .wl-acts > button, .is-readonly .wl-status-seg, .is-readonly .wl-mine,
.is-readonly .wl-tail, .is-readonly .wl-season-acts { display: none; }

@container wl (max-width: 1100px) {
  .wl-pick:has(.wl-then) { grid-template-columns: 148px minmax(0, 1fr); }
  .wl-then { grid-column: 1 / -1; padding: 12px 0 0; border-left: 0; border-top: 1px solid var(--line-soft); }
  .wl-then-list { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

@container wl (max-width: 760px) {

  .wl-tools { width: 100%; }
  .wl-tab { flex: 1 1 0; }
  .wl-tools { flex: none; }
  .wl-search { flex: 1 1 auto; }
}

/* A title's page takes the whole layer when there is no room beside the list. */
@container wl (max-width: 1000px) {
  .wl-page.has-detail { grid-template-columns: minmax(0, 1fr); }
  .wl-page.has-detail > .wl-main { display: none; }
  .wl-detail { position: static; max-height: none; overflow: visible; border: 0; padding: 0; background: none; border-radius: 0; }
}

/* A phone. */
@container wl (max-width: 560px) {
  .wl-headline { font-size: 18px; }
  .wl-addfield { width: 100%; }
  .wl-tonight { padding: 16px; gap: 12px; }
  .wl-add { padding: 12px; }
  .wl-times { width: 100%; }

  .wl-pick, .wl-pick:has(.wl-then) { grid-template-columns: 92px minmax(0, 1fr); gap: 8px 14px; }
  .wl-pick-poster { grid-row: 1 / span 3; }
  .wl-pick-body { display: contents; }
  .wl-pick-title, .wl-pick-facts { grid-column: 2; }
  .wl-pick-title { font-size: 22px; align-self: end; }
  .wl-pick-why, .wl-pick-body > .wl-progress, .wl-pick-body > .wl-acts { grid-column: 1 / -1; }

  .wl-pick-body > .wl-acts > .ctl { flex: 1 1 auto; }
  .wl-pick-body > .wl-acts > .wl-primary { flex: 1 1 100%; }

  .wl-then { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; grid-column: 1 / -1; padding: 8px 0 0; }
  .wl-then-list { display: flex; flex-wrap: wrap; gap: 0 12px; grid-template-columns: none; }
  .wl-then-list li:nth-child(n+3) { display: none; }
  .wl-then-item { padding: 0; gap: 0; min-height: 44px; }
  .wl-then-item .wl-poster, .wl-then-item .wl-match-facts { display: none; }
  .wl-then-title { color: var(--accent); }
  .wl-pick-why { font-size: 13px; }
  .wl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  .wl-poster.is-big { width: 108px; flex-basis: 108px; }
  .wl-card-row .wl-quick, .wl-quick-pair { width: 100%; }
  .wl-quick-pair .wl-quick { flex: 1 1 auto; }
  .wl-choices { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .wl-filters { padding: 12px; }
  .wl-detail-acts .ctl { flex: 1 1 auto; }
  .wl-detail-acts .wl-primary { flex: 1 1 100%; }
  .wl-pad-nums { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: none; }
  .wl-sheet-person { grid-template-columns: auto minmax(0, 1fr); }
  .wl-sheet-person > .wl-acts { grid-column: 2; }

@container wl (max-width: 560px) {

    var seq = ++W.seq;
    if (!quiet) { W.loading = !W.data; draw(); }
    return ask(api()).then(function (j) {
      if (seq !== W.seq) { return; }
      W.data = j; W.error = ''; W.loading = false;
      if (guest()) { W.list = String(j.list); }
      else if (W.list !== 'all' && W.list !== '0' && !listById(W.list)) { W.list = 'all'; }
      if (W.detail && !find(W.detail)) { W.detail = 0; W.editing = false; }
      draw();
    }).catch(function (e) {
      if (seq !== W.seq) { return; }
      W.loading = false; W.error = e.message; draw();
    });
  }

  function items() { return (W.data && W.data.items) || []; }
  function lists() { return (W.data && W.data.lists) || []; }
  function listById(id) {
    var all = lists();
    for (var i = 0; i < all.length; i++) { if (String(all[i].id) === String(id)) { return all[i]; } }
    return null;
  }
  // The list shown, or null on All and My list.
  function shownList() { return W.list === 'all' || W.list === '0' ? null : listById(W.list); }
  // Whether a list is kept with somebody: a list of his own with nobody on it is just his (step 202-04).
  function isShared(id) {
    if (!id) { return false; }
    if (guest()) { return true; }
    var l = listById(id);
    return !!(l && l.people && l.people.length);
  }
  function listName(id) {
    if (!id) { return 'My list'; }
    var l = listById(id);
    return l ? l.name : 'a shared list';
  }
  // The titles of the list shown: every count, Tonight and the shelf read these.
  function inList() {
    if (W.list === 'all') { return items(); }
    var id = W.list === '0' ? 0 : parseInt(W.list, 10);
    return items().filter(function (t) { return (t.list || 0) === id; });
  }
  function countOf(list) {
    var c = { to_watch: 0, watching: 0, watched: 0, all: 0 };
    list.forEach(function (t) { c[t.status] = (c[t.status] || 0) + 1; c.all += 1; });
    return c;
  }
  function pickList(v) {
    W.list = v; W.skip = []; W.q = ''; W.kind = ''; W.where = ''; W.tag = '';
    if (!guest()) { remember(v); }
    draw();
  }
  function find(n) {
    var all = items();
    for (var i = 0; i < all.length; i++) { if (all[i].number === n) { return all[i]; } }
    return null;
  }
  function put(item) {
    if (!W.data) { return; }
    var all = W.data.items, i;
    for (i = 0; i < all.length; i++) { if (all[i].number === item.number) { all[i] = item; break; } }
    if (i === all.length) { all.push(item); }
    recount();
  }
  function recount() {
    var c = { to_watch: 0, watching: 0, watched: 0, all: 0 };
    items().forEach(function (t) { c[t.status] = (c[t.status] || 0) + 1; c.all += 1; });
    W.data.counts = c;
  }
  function counts() { return countOf(inList()); }

  // Every write goes through here: the title it answers is put in place, and the page is drawn again.
  function act(url, body, done) {
    return ask(url, body || {}).then(function (j) {
      if (j.item) { put(j.item); }
      if (done) { done(j); }
      draw();
      return j;
    }).catch(function (e) { toast(e.message); draw(); });
  }

  function toast(text, undo, rate) {
    clearTimeout(W.toastTimer);
    W.toast = { text: text, undo: undo || null, rate: rate || null };
    W.toastTimer = setTimeout(function () { W.toast = null; drawToast(); }, rate ? 12000 : undo ? 8000 : 4500);
    drawToast();
  }

  /* ---- what is shown ---- */

  // Tonight: the show they are in the middle of first, newest touched first, then Up next in their
  // order, within the time they have. The same rule as `watchlist.tonight`, on the same list.
  function tonight() {
    var m = W.minutes ? parseInt(W.minutes, 10) : 0;
    var fits = function (t) { return !m || (t.runtime && t.runtime <= m); };
    var left = inList().filter(function (t) { return t.status !== 'watched' && fits(t); });
    var watching = left.filter(function (t) { return t.status === 'watching'; })
      .sort(function (a, b) { return b.updated_at - a.updated_at; });
    var next = left.filter(function (t) { return t.status === 'to_watch'; })
      .sort(function (a, b) { return a.rank - b.rank || a.number - b.number; });
    return watching.concat(next);
  }

  function names(list) {
    if (list.length < 2) { return list.join(''); }
    return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
  }
  // On a shared list: who added it, and who has seen it before, so two people can choose.
  function together(t) {
    if (!t.list) { return ''; }
    var bits = [];
    if (W.list === 'all' && !guest()) { bits.push('On ' + listName(t.list) + '.'); }
    if (!isShared(t.list)) { return bits.join(' '); }
    bits.push((t.added_by_name || 'You') + ' added it.');
    var others = t.others || [];
    var seen = others.filter(function (o) { return o.seen_before; }).map(function (o) { return o.name; });
    if (t.seen_before) { seen.unshift('You'); }
    if (!seen.length) { bits.push(others.length === 1 ? 'Neither of you has seen it.' : 'Nobody on the list has seen it.'); }
    else { bits.push(names(seen) + (seen.length === 1 && seen[0] !== 'You' ? ' has' : ' have') + ' seen it before.'); }
    return bits.join(' ');
  }
  function why(t, list) {
    var we = isShared(t.list) ? ' together' : '';
    if (t.status === 'watching') {
      // Step 202-05: the next episode is on the press and under the bar, so the sentence stays short.
      return 'You are in the middle of it' + we + '.' + (W.list === 'all' && t.list && !guest() ? ' On ' + listName(t.list) + '.' : '');
    }
    var ahead = list.filter(function (x) { return x.status === 'to_watch'; });
    var at = ahead.indexOf(t) + 1;
    var s = at === 1 ? 'It is first in Up next, your list to watch.' : 'It is number ' + at + ' in Up next, your list to watch.';
    if (t.recommended_by) { s += ' ' + t.recommended_by + ' recommended it.'; }
    if (t.times_watched) { s += ' A rewatch: watched ' + times(t.times_watched) + ' before.'; }
    if (t.list) { var tg = together(t); if (tg) { s += ' ' + tg; } }
    return s;
  }

  function shown() {
    var list = inList().slice();
    if (W.view === 'next') { list = list.filter(function (t) { return t.status !== 'watched'; }); }
    if (W.view === 'watched') { list = list.filter(function (t) { return t.status === 'watched'; }); }
    if (W.kind === 'film') { list = list.filter(function (t) { return t.kind === 'film'; }); }
    if (W.kind === 'show') { list = list.filter(function (t) { return serial(t); }); }
    if (W.where) { list = list.filter(function (t) { return (t.where || '') === (W.where === '-' ? '' : W.where); }); }
    if (W.tag) { list = list.filter(function (t) { return hasTag(t, W.tag); }); }
    var q = norm(W.q.trim());
    if (q) { list = list.filter(function (t) { return matchesQ(t, q); }); }
    var sort = W.sort;
    var by = {
      added: function (a, b) { return b.added_at - a.added_at; },
      year: function (a, b) { return (b.year || 0) - (a.year || 0); },
      short: function (a, b) { return (a.runtime || 9999) - (b.runtime || 9999); },
      rating: function (a, b) { return (b.rating || 0) - (a.rating || 0); },
      mine: function (a, b) { return (b.my_rating || 0) - (a.my_rating || 0) || (b.watched_at || 0) - (a.watched_at || 0); },
      title: function (a, b) { return norm(a.title).localeCompare(norm(b.title)); }
    }[sort];
    if (by) { list.sort(by); }
    else if (W.view === 'watched') { list.sort(function (a, b) { return (b.watched_at || 0) - (a.watched_at || 0); }); }
    else {
      var rankOf = { watching: 0, to_watch: 1, watched: 2 };
      list.sort(function (a, b) {
        return (rankOf[a.status] - rankOf[b.status]) ||
          (a.status === 'watching' ? b.updated_at - a.updated_at : a.rank - b.rank) || a.number - b.number;
      });
    }
    return list;
  }

  function hasTag(t, tag) {
    var k = norm(tag);
    return (t.tags || []).some(function (x) { return norm(x) === k; });
  }
  function matchesQ(t, q) {
    return [t.title, t.cast, t.notes, t.recommended_by, t.where, (t.genres || []).join(' '), (t.tags || []).join(' '), t.years]
      .some(function (s) { return norm(s).indexOf(q) >= 0; });
  }
  // Every tag on the titles given, most used first, as [tag, count].
  function tagsOf(list) {
    var n = {}, shownAs = {};
    list.forEach(function (t) {
      (t.tags || []).forEach(function (x) { var k = norm(x); n[k] = (n[k] || 0) + 1; if (!shownAs[k]) { shownAs[k] = x; } });
    });
    return Object.keys(n).sort(function (a, b) { return n[b] - n[a] || a.localeCompare(b); })
      .map(function (k) { return [shownAs[k], n[k]]; });
  }

  /* ---- drawing ---- */

  function poster(t, cls) {
    var box = el('div', 'wl-poster' + (cls ? ' ' + cls : ''));
    var none = function () {
      box.textContent = '';
      box.classList.add('is-none');
      var hue = 0, s = t.title || '?';
      for (var i = 0; i < s.length; i++) { hue = (hue * 31 + s.charCodeAt(i)) % 360; }
      box.style.setProperty('--wl-hue', String(hue));
      var words = s.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
      var mark = el('span', 'wl-initials', (words[0] || '?').charAt(0) + (words[1] ? words[1].charAt(0) : ''));
      mark.setAttribute('aria-hidden', 'true');
      box.appendChild(mark);
      box.appendChild(el('span', 'wl-sr', 'No poster'));
    };
    if (t.poster) {
      var img = el('img');
      img.alt = 'Poster of ' + t.title;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', none);
      img.src = t.poster;
      box.appendChild(img);
    } else { none(); }
    return box;
  }

  function progress(t, cls) {
    if (!serial(t) || !t.episodes) { return null; }
    var wrap = el('div', 'wl-progress' + (cls ? ' ' + cls : ''));
    var bar = el('div', 'wl-bar');
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', String(t.episodes));
    bar.setAttribute('aria-valuenow', String(t.episodes_seen));
    bar.setAttribute('aria-label', t.episodes_seen + ' of ' + t.episodes + ' episodes seen');
    var fill = el('span', 'wl-fill');
    fill.style.width = Math.round(100 * t.episodes_seen / t.episodes) + '%';
    bar.appendChild(fill);
    wrap.appendChild(bar);
    var words = t.episodes_seen + ' of ' + t.episodes + ' episodes';
    if (t.next && t.status === 'watching') { words = 'Next ' + epLabel(t.next) + ', ' + words; }
    wrap.appendChild(el('span', 'wl-progress-words', words));
    return wrap;
  }

  function statusMark(t) {
    var m = el('span', 'wl-status wl-status-' + t.status);
    var dot = el('span', 'wl-status-shape');
    dot.setAttribute('aria-hidden', 'true');
    m.appendChild(dot);
    m.appendChild(document.createTextNode(t.status_said || ''));
    return m;
  }

  // A rating as its number out of 10: "8/10", never stars to count.
  function score(r, who) {
    if (!r) { return null; }
    var s = el('span', 'wl-score');
    s.setAttribute('aria-label', (who || 'Your rating') + ': ' + r + ' out of 10');
    s.appendChild(el('span', 'wl-score-n', r));
    s.appendChild(el('span', 'wl-score-of', '/10'));
    return s;
  }

  // The one press a card offers: the next episode seen, or a film watched.
  function quick(t) {
    if (t.status === 'watched') {
      var a = button('ctl small wl-quick wl-quick-again', '', function () { watchAgain(t); }, 'Watch ' + t.title + ' again');
      a.appendChild(icon(I.again, 14));
      a.appendChild(document.createTextNode('Watch again'));
      return a;
    }
    if (serial(t) && t.next) {
      // Step 202-05: one press on a card; all of it watched is the title page's Status.
      return button('ctl small wl-quick', 'Seen ' + epLabel(t.next), function () { stepOn(t); },
                    'Mark season ' + t.next.season + ', episode ' + t.next.episode + ' of ' + t.title + ' seen');
    }
    return button('ctl small wl-quick', 'Mark watched', function () { markWatched(t); }, 'Mark ' + t.title + ' watched');
  }

  function card(t) {
    var li = el('li', 'wl-card');
    li.dataset.number = String(t.number);
    var open = el('a', 'wl-open');
    open.href = href(t.number);
    open.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
      e.preventDefault();
      openDetail(t.number);
    });
    open.appendChild(poster(t));
    var text = el('span', 'wl-card-text');
    text.appendChild(el('span', 'wl-card-title', t.title));
    text.appendChild(el('span', 'wl-card-facts', facts(t) + (t.runtime ? ', ' + mins(t.runtime) + (serial(t) ? ' an episode' : '') : '')));
    var who = [];
    if (W.list === 'all' && !guest() && lists().length) { who.push(listName(t.list)); }
    if (isShared(t.list)) { who.push('added by ' + (t.added_by_name || 'you')); }
    if (who.length) { text.appendChild(el('span', 'wl-card-who', who.join(', ').replace(/^./, function (x) { return x.toUpperCase(); }))); }
    open.appendChild(text);
    li.appendChild(open);
    if ((t.tags || []).length) { li.appendChild(tagChips(t.tags.slice(0, 3), t.tags.length - 3)); }
    var foot = el('div', 'wl-card-foot');
    var p = progress(t);
    if (p) { foot.appendChild(p); }
    var row = el('div', 'wl-card-row');
    if (t.status === 'watched') {
      var said = el('span', 'wl-card-said');
      said.appendChild(score(t.my_rating) || el('span', 'wl-dim', 'Not rated'));
      said.appendChild(el('span', 'wl-dim', t.times_watched > 1 ? 'watched ' + times(t.times_watched) : 'watched ' + day(t.watched_at)));
      row.appendChild(said);
      (t.others || []).forEach(function (o) {
        row.appendChild(el('span', 'wl-dim wl-their', o.name + ': ' + (o.rating ? rated(o.rating) : 'not rated')));
      });
    } else {
      row.appendChild(statusMark(t));
      var sc = score(t.my_rating);
      if (sc) { row.appendChild(sc); }
      if (t.times_watched) {
        var rw = el('span', 'wl-rewatch', 'Rewatch');
        rw.title = 'Watched ' + times(t.times_watched) + ': ' + watchDays(t);
        row.appendChild(rw);
      }
    }
    var q = quick(t);
    if (q) { row.appendChild(q); }
    foot.appendChild(row);
    li.appendChild(foot);
    return li;
  }

  function headline() {
    var c = counts();
    var l = shownList();
    if (!c.all) {
      return l ? 'Nothing on ' + l.name + ' yet.' : W.list === '0' && items().length ? 'Nothing on My list: everything is on a shared list.'
        : 'Your watch list is empty.';
    }
    return (l ? l.name + ': ' : W.list === '0' && lists().length ? 'My list: ' : '') + counted0(c);
  }
  function counted0(c) {
    var bits = [];
    if (c.watching) { bits.push(counted(c.watching, 'watching', 'watching')); }
    bits.push(counted(c.to_watch, 'to watch', 'to watch'));
    if (c.watched) { bits.push(counted(c.watched, 'watched', 'watched')); }
    return bits.join(', ').replace(/^./, function (x) { return x.toUpperCase(); }) + '.';
  }

  function drawTonight(into) {
    var all = tonight();
    var left = all.filter(function (t) { return W.skip.indexOf(t.number) < 0; });
    if (!left.length && all.length) { W.skip = []; left = all; }
    var sec = el('section', 'wl-tonight');
    sec.setAttribute('aria-labelledby', 'wlTonightH');
    var head = el('div', 'wl-tonight-head');
    var h = el('h4', 'wl-h', (shownList() && isShared(shownList().id)) || guest() ? 'Tonight, together' : 'Tonight');
    h.id = 'wlTonightH';
    head.appendChild(h);
    var times = el('div', 'wl-seg wl-times');
    times.setAttribute('role', 'group');
    times.setAttribute('aria-label', 'How long you have');
    TIMES.forEach(function (o) {
      var b = button('wl-seg-b', o[1], function () { W.minutes = o[0]; W.skip = []; draw(); });
      b.setAttribute('aria-pressed', W.minutes === o[0] ? 'true' : 'false');
      times.appendChild(b);
    });
    if (all.length || W.minutes) { head.appendChild(times); }
    sec.appendChild(head);
    var t = left[0];
    var longer = W.minutes ? inList().filter(function (x) {
      return x.status !== 'watched' && (!x.runtime || x.runtime > parseInt(W.minutes, 10));
    }).length : 0;
    if (longer && t) {
      var hid = el('p', 'wl-hint wl-hidden-note', counted(longer, 'title is', 'titles are') + ' left out: longer than ' + mins(parseInt(W.minutes, 10)) + ', or of a length not known.');
      var anyb = button('wl-inline', 'Show any length', function () { W.minutes = ''; draw(); });
      hid.appendChild(anyb);
      sec.appendChild(hid);
    }
    if (!t) {
      var none = el('div', 'wl-tonight-none');
      var c = counts();
      none.appendChild(el('p', 'wl-lede', !c.all ? 'Add a title and Tonight picks from your list.'
        : (c.to_watch + c.watching) ? 'Nothing left on your list is ' + mins(parseInt(W.minutes, 10)) + ' or shorter.'
          : 'You have watched everything on your list.'));
      if (W.minutes) {
        none.appendChild(button('ctl small', 'Any length', function () { W.minutes = ''; draw(); }));
      } else if (c.all) {
        none.appendChild(button('ctl small', 'Add a title', function () { startAdd(); }));
      }
      sec.appendChild(none);
      into.appendChild(sec);
      return;
    }
    var pick = el('div', 'wl-pick');
    var po = el('a', 'wl-pick-poster');
    po.href = href(t.number);
    po.setAttribute('aria-label', 'Open ' + t.title);
    po.addEventListener('click', function (e) { e.preventDefault(); openDetail(t.number); });
    po.appendChild(poster(t));
    pick.appendChild(po);
    var body = el('div', 'wl-pick-body');
    var title = el('h5', 'wl-pick-title');
    var ta = el('a', '', t.title);
    ta.href = href(t.number);
    ta.addEventListener('click', function (e) { e.preventDefault(); openDetail(t.number); });
    title.appendChild(ta);
    body.appendChild(title);
    var meta = [facts(t)];
    if (t.runtime) { meta.push(mins(t.runtime) + (serial(t) ? ' an episode' : '')); }
    body.appendChild(el('p', 'wl-pick-facts', meta.join(', ')));
    body.appendChild(el('p', 'wl-pick-why', why(t, all)));
    var p = progress(t, 'is-wide');
    if (p) { body.appendChild(p); }
    var acts = el('div', 'wl-acts');
    var lead = W.detail ? 'ctl' : 'ctl wl-primary';
    if (serial(t) && t.next) {
      var main = button(lead, '', function () { stepOn(t); });
      main.appendChild(icon(I.check));
      main.appendChild(document.createTextNode('Seen ' + epWords(t.next)));
      main.setAttribute('aria-label', 'Mark season ' + t.next.season + ', episode ' + t.next.episode + ' seen');
      acts.appendChild(main);
    } else {
      var w = button(lead, '', function () { markWatched(t); });
      w.appendChild(icon(I.check));
      w.appendChild(document.createTextNode('Watched it'));
      acts.appendChild(w);
    }
    if (t.where_url || t.links.where_find) {
      var go = el('a', 'ctl wl-ghost');
      go.href = t.where_url || t.links.where_find;
      go.target = '_blank';
      go.rel = 'noopener';
      go.appendChild(icon(I.play));
      go.appendChild(document.createTextNode(t.where_url && t.where ? 'Open ' + t.where : 'Where to watch'));
      acts.appendChild(go);
    }
    if (left.length > 1) {
      var other = button('ctl wl-ghost', '', function () { W.skip.push(t.number); draw(); });
      other.appendChild(icon(I.shuffle));
      other.appendChild(document.createTextNode('Something else'));
      acts.appendChild(other);
    }
    body.appendChild(acts);
    pick.appendChild(body);
    var after = left.slice(1, 4);
    if (after.length) {
      var then = el('div', 'wl-then');
      then.appendChild(el('h5', 'wl-then-h', 'After that'));
      var ul = el('ol', 'wl-then-list');
      after.forEach(function (x) {
        var li = el('li');
        var a = el('a', 'wl-then-item');
        a.href = href(x.number);
        a.addEventListener('click', function (e) { e.preventDefault(); openDetail(x.number); });
        a.appendChild(poster(x, 'is-thumb'));
        var tx = el('span', 'wl-match-text');
        tx.appendChild(el('span', 'wl-then-title', x.title));
        var f = [];
        if (x.status === 'watching' && x.next) { f.push('next ' + epLabel(x.next)); }
        if (x.times_watched && x.status !== 'watched') { f.push('a rewatch'); }
        if (x.runtime) { f.push(mins(x.runtime) + (serial(x) ? ' an episode' : '')); }
        if (x.where) { f.push(x.where); }
        tx.appendChild(el('span', 'wl-match-facts', f.join(', ') || (KIND[x.kind] || '')));
        a.appendChild(tx);
        li.appendChild(a);
        ul.appendChild(li);
      });
      then.appendChild(ul);
      pick.appendChild(then);
    }
    sec.appendChild(pick);
    into.appendChild(sec);
  }

  function select(label, value, options, change) {
    var wrap = el('label', 'wl-field wl-select');
    wrap.appendChild(el('span', 'wl-field-label', label));
    var s = el('select', 'wl-in');
    options.forEach(function (o) {
      var op = el('option', '', o[1]);
      op.value = o[0];
      if (o[0] === value) { op.selected = true; }
      s.appendChild(op);
    });
    s.addEventListener('change', function () { change(s.value); });
    wrap.appendChild(s);
    return wrap;
  }

  // A row of choices, each one press (step 202-05): Kind, Where, Tag and Sort in the Filter panel.
  function choices(label, value, options, change) {
    var g = el('div', 'wl-choices');
    g.setAttribute('role', 'group');
    g.setAttribute('aria-label', label);
    g.appendChild(el('span', 'wl-field-label', label));
    var row = el('div', 'wl-choice-row');
    options.forEach(function (o) {
      var b = button('wl-opt', '', function () { change(o[0]); });
      b.setAttribute('aria-pressed', o[0] === value ? 'true' : 'false');
      b.appendChild(el('span', '', o[1]));
      if (o[2]) { b.appendChild(el('span', 'wl-opt-n', o[2])); }
      row.appendChild(b);
    });
    g.appendChild(row);

  /** @param {HTMLElement} [into] the grid's box, before it is on the page */
  function drawGrid(into) {
    var grid = into || $('wlGrid');
    if (!grid) { return; }
    grid.textContent = '';
    var list = shown();
    var filtered = W.q.trim() || W.kind || W.where || W.tag;
    // Searching Up next: a title watched already is still there to watch again, so say it is in Watched.
    var also = [];
    if (W.view === 'next' && (W.q.trim() || W.tag)) {
      var q = norm(W.q.trim());
      also = inList().filter(function (t) {
        return t.status === 'watched' && (!q || matchesQ(t, q)) && (!W.tag || hasTag(t, W.tag));
      });
    }
    function alsoNote() {
      if (!also.length) { return null; }
      var n = el('div', 'wl-also');
      n.appendChild(el('span', 'wl-hint', (also.length === 1 ? also[0].title + ' is' : counted(also.length, 'title', 'titles') + ' that match are') +
        ' in Watched, ready to watch again.'));
      n.appendChild(button('ctl small', also.length === 1 ? 'Show it' : 'Show them', function () { W.view = 'all'; W.sort = ''; draw(); }));
      return n;
    }
    if (!list.length) {
      var empty = el('div', 'wl-empty');
      if (filtered) {
        empty.appendChild(el('p', 'wl-lede', 'Nothing here matches.'));
        empty.appendChild(button('ctl small', 'Clear the search and filters', function () {
          W.q = ''; W.kind = ''; W.where = ''; W.tag = ''; draw();
        }));
        var an = alsoNote();
        if (an) { empty.appendChild(an); }
      } else if (W.view === 'watched') {
        empty.appendChild(el('p', 'wl-lede', 'Nothing finished yet. A film comes here when you mark it watched, a show when its last episode is seen.'));
      } else {
        empty.appendChild(el('p', 'wl-lede', counts().all ? 'Up next is empty: you have watched everything.'
          : 'Nothing on your list yet.'));
        empty.appendChild(button('ctl small', 'Add a title', function () { startAdd(); }));
      }
      grid.appendChild(empty);
      return;
    }
    if (filtered) {
      grid.appendChild(el('p', 'wl-found', counted(list.length, 'title', 'titles') + ' found'));
      var an2 = alsoNote();
      if (an2) { grid.appendChild(an2); }
    }
    var ul = el('ul', 'wl-grid');
    list.forEach(function (t) { ul.appendChild(card(t)); });
    grid.appendChild(ul);
  }


  /* ---- lists, and the people on them ---- */

  function initials(name) {
    var words = String(name || '?').replace(/@.*$/, '').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
    return ((words[0] || '?').charAt(0) + (words[1] ? words[1].charAt(0) : '')).toUpperCase();
  }
  function face(name, cls) {
    var f = el('span', 'wl-face' + (cls ? ' ' + cls : ''), initials(name));

  }

  // All, My list and each shared list, with what is left to watch on each. Only once a list is shared.
  // Step 202-05: one strip, always there for the owner: All lists, My list, each list, then New list.
  // It never wraps; it scrolls inside itself, with a fade at the edge that has more.
  function drawLists(into) {
    if (guest()) { return; }
    var wrap = el('div', 'wl-strip');
    var row = el('div', 'wl-lists');
    row.setAttribute('role', 'group');

    var none = !lists().length;
    var opts = none ? [] : [['all', 'All lists', items()]];
    opts.push(['0', 'My list', items().filter(function (t) { return !t.list; })]);
    lists().forEach(function (l) {
      opts.push([String(l.id), l.name, items().filter(function (t) { return t.list === l.id; }), l]);
    });
    opts.forEach(function (o) {
      var c = countOf(o[2]);
      var b = button('wl-list-b', '', function () { pickList(o[0]); });
      var on = none ? o[0] === '0' : W.list === o[0];
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (o[3] && o[3].people && o[3].people.length) {
        var sh = icon(I.people, 14);
        sh.setAttribute('aria-hidden', 'true');
        b.appendChild(sh);
      }
      b.appendChild(el('span', 'wl-list-name', o[1]));
      b.appendChild(el('span', 'wl-tab-n', c.all));
      b.setAttribute('aria-label', o[1] + ', ' + counted(c.all, 'title', 'titles') + (o[3] && o[3].people.length ? ', shared' : ''));
      row.appendChild(b);
    });
    var nl = button('wl-list-b wl-list-new', '', function () { openSheet('list'); });
    nl.id = 'wlNewList';
    nl.setAttribute('aria-haspopup', 'dialog');
    nl.appendChild(icon(I.plus, 14));
    nl.appendChild(el('span', 'wl-list-name', 'New list'));
    var line = el('div', 'wl-strip-line' + (none ? '' : ' has-lists'));
    wrap.appendChild(row);
    line.appendChild(wrap);
    line.appendChild(nl);
    if (!none && W.list === 'all') {
      // Every list at once: Share a list sits on this row, so no line of its own is needed.
      var sa = button('wl-list-b wl-list-new', '', function () { openSheet('new'); });
      sa.id = 'wlShareBtn';
      sa.setAttribute('aria-haspopup', 'dialog');
      sa.appendChild(icon(I.people, 14));
      sa.appendChild(el('span', 'wl-list-name', 'Share a list'));
      line.appendChild(sa);
    }
    into.appendChild(line);
    // The fade says there is more to the side; it goes once the strip is scrolled to that end.
    var edge = function () {
      wrap.classList.toggle('has-more-right', row.scrollLeft + row.clientWidth < row.scrollWidth - 2);
      wrap.classList.toggle('has-more-left', row.scrollLeft > 2);
    };
    row.addEventListener('scroll', edge, { passive: true });
    requestAnimationFrame(function () {
      var on = row.querySelector('[aria-pressed="true"]');
      if (on && (on.offsetLeft + on.offsetWidth > row.scrollLeft + row.clientWidth - 56 || (row.scrollLeft > 2 && on.offsetLeft < row.scrollLeft + 56))) {
        row.scrollLeft = Math.max(0, on.offsetLeft - 60);
      }
      edge();
    });
  }

  function invite(S, id) {
    var email = S.email.trim();
    if (!email) { S.said = 'Write their email address first.'; S.link = ''; draw(); return; }
    S.busy = true; draw();
    var body = { email: email, name: S.name.trim(), role: S.role, notify: S.letter };
    var url = id ? api('/lists/' + id + '/invite') : api('/lists/new');
    if (!id) {
      body.list_name = (S.listName || defaultName(S)).trim();
      body.titles = Object.keys(S.bring).filter(function (k) { return S.bring[k]; }).map(Number);
    }
    ask(url, body).then(function (j) {
      W.data = j.data || W.data;
      S.busy = false; S.said = j.said; S.link = j.link || '';
      if (!id && j.list) { S.mode = 'people'; S.id = j.list.id; W.list = String(j.list.id); remember(W.list); }
      S.email = ''; S.name = ''; S.letter = false;
      draw();
    }).catch(function (e) { S.busy = false; S.said = e.message; S.link = ''; draw(); });
  }
  function defaultName(S) {
